security:
    password_hashers:
        SuperVMar\Authentication\Infrastructure\Symfony\SecurityUser:
            id: SuperVMar\Authentication\Infrastructure\Symfony\Md5PasswordHasher

    providers:
        app_user_provider:
            id: SuperVMar\Authentication\Infrastructure\Symfony\SecurityUserProvider

    firewalls:
        login:
            pattern: ^/api/login
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/v1/push-vapid-key$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/user, methods: [PUT], roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
