security:
    password_hashers:
        SuperVMar\Authentication\Infrastructure\Symfony\SecurityUser:
            id: SuperVMar\Authentication\Infrastructure\Symfony\BcryptPasswordHasher

    providers:
        app_user_provider:
            id: SuperVMar\Authentication\Infrastructure\Symfony\SecurityUserProvider

    role_hierarchy:
        ROLE_ADMIN: [ROLE_ENCARGADO]
        ROLE_ENCARGADO: [ROLE_CAJERO, ROLE_REPONEDOR]

    firewalls:
        login:
            pattern: ^/api/login
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/v1/push-vapid-key$, roles: PUBLIC_ACCESS }

        - { path: ^/api/v1/user/.+/change-password$, methods: [PUT], roles: IS_AUTHENTICATED_FULLY }

        - { path: ^/api/v1/user/[^/]+$, methods: [PUT], roles: PUBLIC_ACCESS }

        - { path: ^/api/v1/push-subscription, roles: ROLE_USER }

        - { path: ^/api/v1/sale_line, roles: ROLE_CAJERO }
        - { path: ^/api/v1/sale_finish, roles: ROLE_CAJERO }
        - { path: ^/api/v1/sale, roles: ROLE_CAJERO }
        - { path: ^/api/v1/sales, roles: ROLE_CAJERO }

        - { path: ^/api/v1/product$, methods: [GET], roles: ROLE_CAJERO }

        - { path: ^/api/v1/products_allocations, methods: [GET], roles: ROLE_REPONEDOR }

        - { path: ^/api/v1/product_allocation, roles: [ROLE_ENCARGADO, ROLE_REPONEDOR] }

        - { path: ^/api/v1/product/.+/receive-stock$, methods: [PUT], roles: ROLE_REPONEDOR }

        - { path: ^/api/v1/product, roles: ROLE_ENCARGADO }
        - { path: ^/api/v1/products, roles: ROLE_ENCARGADO }

        - { path: ^/api/v1/categor, roles: ROLE_ENCARGADO }
        - { path: ^/api/v1/tax, roles: ROLE_ENCARGADO }
        - { path: ^/api/v1/supplier, roles: ROLE_ENCARGADO }

        - { path: ^/api/v1/supermarkets$, methods: [GET], roles: ROLE_REPONEDOR }

        - { path: ^/api/v1/supermarket, roles: ROLE_ENCARGADO }
        - { path: ^/api/v1/zone, roles: ROLE_ENCARGADO }

        - { path: ^/api/v1/user, methods: [GET, DELETE], roles: ROLE_ADMIN }
        - { path: ^/api/v1/users, roles: ROLE_ADMIN }
        - { path: ^/api/v1/job, roles: ROLE_ADMIN }

        # Default: require authentication
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
