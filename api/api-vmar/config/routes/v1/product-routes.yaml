product_receive_stock:
  path: /product/{idProduct}/receive-stock
  controller: SuperVMar\App\Controller\Product\ProductReceiveStockPutController
  methods: PUT

product_post:
  path: /product/{id}
  controller: SuperVMar\App\Controller\Product\ProductPostController
  methods: POST

product_delete:
  path: /product/{id}
  controller: SuperVMar\App\Controller\Product\ProductDeleteController
  methods: DELETE

products_get:
  path: /products
  controller: SuperVMar\App\Controller\Product\ProductsGetController
  methods: GET

product_get:
  path: /product
  controller: SuperVMar\App\Controller\Product\ProductGetController
  methods: GET