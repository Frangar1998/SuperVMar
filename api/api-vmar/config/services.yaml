parameters:
    defaultPrefetchCount: 0
    defaultMaxMessages: 0

services:
    _defaults:
        autowire: true
        autoconfigure: true

    ## Mapping configuration ##
    SuperVMar\:
        resource: '../src/'

    SuperVMar\App\Controller\:
        resource: '../app/Controller'
        tags: [ 'controller.service_arguments' ]

    SuperVMar\Shared\Infrastructure\Symfony\ApiExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onException }

    _instanceof:
        SuperVMar\Shared\Domain\Bus\Event\DomainEventSubscriber:
            tags: [ 'supervmar.domain_event_subscriber' ]

        SuperVMar\Shared\Domain\Bus\Command\CommandHandler:
            tags: [ 'supervmar.command_handler' ]

        SuperVMar\Shared\Infrastructure\Symfony\TransactionSymfonyMiddleware:
            tags: [ 'supervmar.command_handler_middleware' ]

        SuperVMar\Shared\Domain\Bus\Query\QueryHandler:
            tags: [ 'supervmar.query_handler' ]

    SuperVMar\Shared\Infrastructure\Symfony\AuthenticationMiddleware:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }

    SuperVMar\Shared\Infrastructure\Symfony\ImageUploader:
        arguments:
            $targetDirectory: '%kernel.project_dir%/public/images/'

    ## Command and Query
    SuperVMar\Shared\Infrastructure\Bus\Command\InMemorySymfonyCommandBus:
        arguments: [ !tagged supervmar.command_handler ]

    SuperVMar\Shared\Infrastructure\Bus\Query\InMemorySymfonyQueryBus:
        arguments: [ !tagged supervmar.query_handler ]

    ## Event ##
    SuperVMar\Shared\Infrastructure\Bus\Event\InMemory\InMemorySymfonyEventBus:
        arguments: [ !tagged supervmar.domain_event_subscriber ]
        lazy: true

    SuperVMar\Shared\Infrastructure\Bus\Event\DomainEventMapping:
        arguments: [ !tagged supervmar.domain_event_subscriber ]

    SuperVMar\Shared\Infrastructure\Bus\Event\DomainEventSubscriberLocator:
        arguments: [ !tagged supervmar.domain_event_subscriber ]

    ## RabbitMQ ##
    SuperVMar\Shared\Infrastructure\Bus\Event\RabbitMQ\RabbitMQConnection:
        arguments:
            $exchangeName: '%env(RABBITMQ_EXCHANGE)%'
            $maxMessages: '%env(default:defaultMaxMessages:RABBITMQ_MAX_MESSAGES)%'
            $prefetchCount: '%env(default:defaultPrefetchCount:RABBITMQ_PREFETCH_COUNT)%'

    PhpAmqpLib\Connection\AMQPSSLConnection:
        arguments:
            $host: '%env(RABBITMQ_HOST)%'
            $port: '%env(RABBITMQ_PORT)%'
            $user: '%env(RABBITMQ_USER)%'
            $password: '%env(RABBITMQ_PASSWORD)%'
            $vhost: '%env(RABBITMQ_VHOST)%'

    PhpAmqpLib\Connection\AbstractConnection: '@PhpAmqpLib\Connection\AMQPSSLConnection'

    SuperVMar\App\Command\RabbitMQConsumeCommand:
        arguments:
            $consumerList: !tagged supervmar.domain_event_subscriber
        tags:
            - { name: rabbit.command }